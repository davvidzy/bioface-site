name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos (astro check)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Playwright + axe (todas as rotas, zero violações)
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y

      - name: Lighthouse CI (orçamentos de performance)
        run: npm run lhci

      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
